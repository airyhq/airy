  <style>
      html, body, .root {
        background-color: white;
        width: max-content;        
        height: max-content;
      }

      .container {
        position: absolute;
        right: 0;
        left: 0;
        background-color: white;
        display: flex;
        flex-direction: column;
        align-items: center;          
      }      

      .headerLogo {
          width: 200px;
          height: 70px;
          margin: 80px 0;
      }

      .content {
          display: flex;
          position: relative;
      }

      .box {
          width: 360px;
          height: 360px;
          margin: 0 40px;
          border: 2px solid #CAD5DB;
          border-radius: 8px;
          text-align: center;
          cursor: pointer;
      }

      .box:hover {
          border: 2px solid #1578D4;
      }

      .boxTitle {
          font-family: 'Lato';
          font-style: normal;
          font-weight: 800;
          font-size: 31px;
          line-height: 37px;
          text-align: center;
          color: #212428;
          margin: 32px 0 56px 0;
      }

      .boxContent {
          font-family: 'Lato';
          font-style: normal;
          font-weight: 400;
          font-size: 20px;
          line-height: 24px;
          text-align: center;
          color: #212428;
          margin: 12px 0 56px 0;
      }

      .boxButton {
          width: 213px;
          height: 48px;
          left: 319px;
          top: 495px;
          background-color: #1578D4;
          color: white;
          font-family: 'Lato';
          font-style: normal;
          font-weight: 700;
          font-size: 16px;
          line-height: 19px;
          border: none;
          border-radius: 10px;
          cursor: pointer;
      }

      @media only screen and (max-device-width: 820px) and (max-device-width: 1200px) {
        .headerLogo {
          width: 150px;
          height: 50px;
          margin: 30px 0;
        }

        .container {
          width: 100%;
          width: -moz-available;          /* WebKit-based browsers will ignore this. */
          width: -webkit-fill-available;  /* Mozilla-based browsers will ignore this. */
          width: fill-available;
          left: auto;
          right: auto;        
        }

        .content {          
          flex-direction: column;          
        }

        .box {
          width: auto;
          height: auto;
          margin: 12px 12px;
          padding: 8px;
        }

        .boxTitle {                    
          font-size: 31px;
          line-height: 37px;          
          margin: 0 0 16px 0;
        }

        .boxContent {          
          font-size: 20px;
          line-height: 24px;
          margin: 12px 0 16px 0;
        }

        .boxButton {
          width: 213px;
          height: 48px;
          left: 319px;
          top: 495px;                              
          font-size: 16px;
          line-height: 19px;                    
        }
      }
  </style>
</head>
